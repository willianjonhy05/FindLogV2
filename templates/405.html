{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>405 - Método Não Permitido | FindLog</title>
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilo exclusivo de erros -->
    <link rel="stylesheet" href="{% static 'css/errors.css' %}">
</head>
<body class="error-body">

    <main class="error-container">
        <div class="error-card">
            <!-- LOGO DO SISTEMA -->
            <div class="logo d-inline-flex align-items-center justify-content-center gap-2 mb-4">
                <span class="logo-icon-wrapper">
                    <i class="bi bi-search"></i>
                </span>
                <span class="logo-text text-white">Find<span class="logo-accent">Log</span></span>
            </div>

            <!-- ÍCONE DO ERRO -->
            <div class="error-icon-box error-icon-danger">
                <i class="bi bi-slash-circle-fill"></i>
            </div>

            <!-- CÓDIGO E MENSAGEM -->
            <h1 class="error-code">405</h1>
            <h2 class="error-title">Método Não Permitido</h2>
            <p class="error-description">
                O método HTTP utilizado para acessar esta rota não é suportado pelo servidor do FindLog. Verifique se o formulário ou requisição foi emitido de forma adequada.
            </p>

            <!-- AÇÕES -->
            <div class="error-actions d-flex justify-content-center align-items-center gap-3 flex-wrap">
                <a href="javascript:history.back()" class="btn btn-error-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Voltar
                </a>    
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
